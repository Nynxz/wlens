[package]
name = "wlens"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "An image viewer for Wayland, configured and extended with Lua"
license = "MIT"
repository = "https://github.com/Nynxz/wlens"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.9", features = ["derive", "env"] }
compress-tools = "0.16.1"
dirs = "7.0.0"
env_logger = "0.11.12"
glyphon = "0.12"
gstreamer = { version = "0.25.4", optional = true }
gstreamer-app = { version = "0.25.2", optional = true }
gstreamer-video = { version = "0.25.4", optional = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "exr", "qoi", "ico", "pnm", "tga"] }
libc = "0.2"
log = "0.4.35"
md5 = "0.8"
mlua = { version = "0.12.2", features = ["lua54", "vendored", "serialize"] }
png = "0.18"
pollster = "1.0.3"
serde_json = "1.0.154"
ureq = { version = "3.5.2", features = ["socks-proxy"] }
url = "2.5.9"
wgpu = { version = "30.0.2", default-features = false, features = ["std", "parking_lot", "vulkan", "gles", "wgsl"] }
# Wayland only: no X11 backend, so we never silently fall back to XWayland.
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen", "wayland-csd-adwaita"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Decoders are painfully slow unoptimised; optimise deps even in dev builds.
[profile.dev.package."*"]
opt-level = 3

[features]
default = ["video"]
# Video playback through GStreamer (needs gstreamer + gst-plugins-base at runtime).
video = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]
